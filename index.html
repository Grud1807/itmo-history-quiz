const elements = Object.fromEntries(
  ["quiz", "position", "category", "progress", "question", "figure", "enlarge", "illustration", "caption",
    "options", "choices", "feedback", "verdict", "explanation", "check", "next", "result", "result-title",
    "score", "restart"].map((id) => [id, document.getElementById(id)]),
);
let index = 0;
let score = 0;
let answered = false;

function showQuestion(moveFocus = false) {
  const question = questions[index];
  answered = false;
  elements.quiz.hidden = false;
  elements.result.hidden = true;
  elements.position.textContent = `Вопрос ${index + 1} из ${questions.length}`;
  elements.category.textContent = question.category;
  elements.progress.value = index;
  elements.question.textContent = question.title;
  elements.figure.hidden = !question.image;
  if (question.image) {
    elements.illustration.src = question.image;
    elements.illustration.alt = question.alt;
    elements.enlarge.href = question.image;
    elements.caption.textContent = question.caption;
  }
  elements.choices.replaceChildren(...question.choices.map((text, optionIndex) => {
    const label = document.createElement("label");
    label.className = "choice";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "answer";
    input.value = optionIndex;
    input.className = "sr-only";
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.setAttribute("aria-hidden", "true");
    letter.textContent = "АБВГ"[optionIndex];
    const option = document.createElement("span");
    option.textContent = text;
    label.append(input, letter, option);
    return label;
  }));
  elements.options.disabled = false;
  elements.feedback.hidden = true;
  elements.check.disabled = true;
  elements.check.hidden = false;
  elements.next.hidden = true;
  if (moveFocus) {
    elements.question.focus();
  }
}

elements.options.addEventListener("change", () => {
  elements.check.disabled = false;
});

elements.check.addEventListener("click", () => {
  const selected = elements.choices.querySelector(":checked");
  if (!selected || answered) return;

  const question = questions[index];
  const correct = Number(selected.value) === question.answer;
  answered = true;
  if (correct) score += 1;

  elements.options.disabled = true;
  Array.from(elements.choices.children).forEach((label, optionIndex) => {
    label.classList.add("locked");
    if (optionIndex === question.answer) label.classList.add("correct");
    else if (optionIndex === Number(selected.value)) label.classList.add("incorrect");
  });
  elements.progress.value = index + 1;
  elements.verdict.textContent = correct
    ? "Верно!"
    : `Правильный ответ — ${question.choices[question.answer]}.`;
  elements.explanation.textContent = question.explanation;
  elements.feedback.hidden = false;
  elements.check.hidden = true;
  elements.next.textContent = index === questions.length - 1 ? "Показать результат →" : "Дальше →";
  elements.next.hidden = false;
  elements.next.focus({ preventScroll: true });
});

elements.next.addEventListener("click", () => {
  if (!answered) return;
  index += 1;
  if (index < questions.length) {
    showQuestion(true);
    return;
  }
  elements.quiz.hidden = true;
  elements.result.hidden = false;
  elements.score.textContent = `${score} из ${questions.length}`;
  elements["result-title"].focus();
});

elements.restart.addEventListener("click", () => {
  index = 0;
  score = 0;
  showQuestion(true);
});

showQuestion();
</script>
</body>
</html>
